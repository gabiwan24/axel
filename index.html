<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Helvetica Typewriter Effect</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-weight: 700;
      background-color: #0f0f11;
      color: #f3f3f6;
    }

    /* Brikett-starke, brutale Helvetica-Typografie */
    .helvetica-bold {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.05;
      text-transform: uppercase;
    }

    /* Blinkender Cursor */
    .cursor {
      display: inline-block;
      width: 0.5em;
      height: 0.9em;
      background-color: #ef4444; /* Rot für Schweizer-Präzisions-Akzent */
      margin-left: 4px;
      vertical-align: baseline;
      animation: blink 0.8s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #18181b;
    }
    ::-webkit-scrollbar-thumb {
      background: #3f3f46;
      border-radius: 3px;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-6 md:p-12 selection:bg-red-500 selection:text-white">

  <!-- Header / Subtiler Status (ohne Titel) -->
  <header class="flex justify-end items-center text-xs tracking-widest text-zinc-500 uppercase font-sans font-medium mb-6">
    <span id="status-badge" class="px-2 py-1 rounded bg-zinc-800 text-zinc-400">BEREIT</span>
  </header>

  <!-- Haupt-Textbereich für die gigantische Typografie -->
  <main class="flex-1 flex items-center justify-center my-auto py-10">
    <div class="w-full max-w-6xl mx-auto">
      <div id="text-display" class="helvetica-bold text-4xl sm:text-6xl md:text-7xl lg:text-8xl xl:text-9xl break-words min-h-[200px] text-zinc-100">
        <span id="typed-content"></span><span id="cursor" class="cursor"></span>
      </div>
    </div>
  </main>

  <!-- Steuerungs-Panel am unteren Bildschirmrand -->
  <footer id="control-panel" class="w-full max-w-5xl mx-auto bg-zinc-900/90 border border-zinc-800 rounded-2xl p-4 md:p-6 backdrop-blur-md shadow-2xl transition-all duration-500">
    
    <!-- Hauptsteuerelemente & Einstellungen -->
    <div class="grid grid-cols-1 md:grid-cols-12 gap-4 items-center">
      
      <!-- Input & Hinzufügen -->
      <div class="md:col-span-5 flex gap-2">
        <input 
          type="text" 
          id="custom-text-input" 
          placeholder="EIGENEN TEXT EINGEBEN..." 
          class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-sm font-semibold tracking-wide text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-red-500 transition-colors uppercase"
        />
        <button 
          id="btn-play-custom" 
          class="bg-red-600 hover:bg-red-500 text-white font-bold px-5 py-3 rounded-xl text-sm transition-all flex items-center justify-center shrink-0 shadow-lg shadow-red-900/20 active:scale-95"
        >
          START
        </button>
      </div>

      <!-- Presets / Vorlagen -->
      <div class="md:col-span-4">
        <select 
          id="preset-select" 
          class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-sm font-semibold text-zinc-300 focus:outline-none focus:border-red-500 transition-colors cursor-pointer uppercase"
        >
          <!-- Dynamisch befüllt aus Standard- und gespeicherten Sätzen -->
        </select>
      </div>

      <!-- Play / Pause / Reset & Hide Controls -->
      <div class="md:col-span-3 flex items-center justify-end gap-2">
        <button 
          id="btn-toggle-pause" 
          class="bg-zinc-800 hover:bg-zinc-700 text-zinc-200 font-bold p-3 rounded-xl text-sm transition-all flex-1 flex items-center justify-center active:scale-95"
          title="Pause / Weiter"
        >
          <svg id="icon-pause" class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
          <svg id="icon-play" class="w-5 h-5 fill-current hidden" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button 
          id="btn-replay" 
          class="bg-zinc-800 hover:bg-zinc-700 text-zinc-200 font-bold p-3 rounded-xl text-sm transition-all flex-1 flex items-center justify-center active:scale-95"
          title="Neustarten"
        >
          <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
        </button>
        <button 
          id="btn-hide-ui" 
          class="bg-zinc-800 hover:bg-zinc-700 text-zinc-200 font-bold p-3 rounded-xl text-sm transition-all flex-1 flex items-center justify-center active:scale-95"
          title="UI ausblenden (Taste H)"
        >
          <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
        </button>
      </div>
    </div>

    <!-- Zusätzliche Optionen & Geschwindigkeitsregler -->
    <div class="mt-4 pt-4 border-t border-zinc-800/80 flex flex-wrap items-center justify-between gap-4 text-xs font-semibold text-zinc-400">
      
      <!-- Geschwindigkeitsregler -->
      <div class="flex items-center gap-3 w-full sm:w-auto">
        <span class="text-zinc-500 uppercase tracking-wider">Tipp-Tempo:</span>
        <input 
          type="range" 
          id="speed-slider" 
          min="30" 
          max="250" 
          value="110" 
          class="accent-red-500 bg-zinc-950 rounded-lg cursor-pointer h-2 w-32"
        />
        <span id="speed-label" class="text-zinc-300 w-12">Normal</span>
      </div>

      <!-- Apostroph-Fehler Vorschau-Info -->
      <div class="flex items-center gap-2 text-zinc-500 italic">
        <span class="inline-block w-2 h-2 rounded-full bg-red-500"></span>
        <span>Drücke 'H' um die Oberfläche komplett aus- oder einzublenden</span>
      </div>

    </div>
  </footer>

  <!-- Re-show UI Button (Escheint nur wenn UI ausgeblendet ist) -->
  <button 
    id="btn-show-ui" 
    class="fixed bottom-6 right-6 bg-zinc-900/80 hover:bg-zinc-800 border border-zinc-800 text-zinc-400 hover:text-white p-3 rounded-full shadow-2xl backdrop-blur-md opacity-0 pointer-events-none transition-all duration-300 z-50"
    title="Interface einblenden (H)"
  >
    <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24"><path d="M12 6c3.79 0 7.17 2.13 8.82 5.5C19.17 14.87 15.79 17 12 17s-7.17-2.13-8.82-5.5C4.83 8.13 8.21 6 12 6m0-2C7 4 2.73 7.11 1 11.5 2.73 15.89 7 19 12 19s9.27-3.11 11-7.5C21.27 7.11 17 4 12 4zm0 5c1.38 0 2.5 1.12 2.5 2.5S13.38 14 12 14s-2.5-1.12-2.5-2.5S10.62 9 12 9m0-2c-2.48 0-4.5 2.02-4.5 4.5S9.52 16 12 16s4.5-2.02 4.5-4.5S14.48 7 12 7z"/></svg>
  </button>

  <script>
    // Standard-Sätze
    const initialSentences = [
      "Sag’ Tschüss zum Agenturleben, Àxel!",
      "Dank’ dir für alles, Àxel!",
      "Auf Àxel’s Wohl stoßen wir an!",
      "Schau’ nach vorne, lieber Àxel! Und ein bisschen zurück!",
      "Mach’s gut im Ruhestand, Àxel!"
    ];

    // Sätze aus dem LocalStorage laden oder mit Standards initialisieren
    let customSavedSentences = JSON.parse(localStorage.getItem('axel_custom_sentences') || '[]');
    let sentenceList = [...initialSentences, ...customSavedSentences];

    // Falsche Apostrophe für den Tippfehler-Effekt
    const wrongApostrophes = ["'", "´", "`", "‘"];

    // DOM-Elemente
    const typedContentEl = document.getElementById('typed-content');
    const statusBadgeEl = document.getElementById('status-badge');
    const customInputEl = document.getElementById('custom-text-input');
    const presetSelectEl = document.getElementById('preset-select');
    const btnPlayCustom = document.getElementById('btn-play-custom');
    const btnTogglePause = document.getElementById('btn-toggle-pause');
    const btnReplay = document.getElementById('btn-replay');
    const btnHideUi = document.getElementById('btn-hide-ui');
    const btnShowUi = document.getElementById('btn-show-ui');
    const controlPanelEl = document.getElementById('control-panel');
    const headerEl = document.querySelector('header');
    const iconPause = document.getElementById('icon-pause');
    const iconPlay = document.getElementById('icon-play');
    const speedSlider = document.getElementById('speed-slider');
    const speedLabel = document.getElementById('speed-label');

    // Select-Optionen rendern
    function renderSelectOptions() {
      presetSelectEl.innerHTML = '';
      sentenceList.forEach((sentence, idx) => {
        const option = document.createElement('option');
        option.value = idx;
        const isCustom = idx >= initialSentences.length;
        option.textContent = `${idx + 1}: ${sentence.substring(0, 30)}${sentence.length > 30 ? '...' : ''}${isCustom ? ' (GESPEICHERT)' : ''}`;
        presetSelectEl.appendChild(option);
      });
    }

    // Status-Variablen
    let currentText = sentenceList[0];
    let currentIndex = 0;
    let autoLoopIndex = 0;
    let isAutoLooping = true;
    let baseSpeed = 110;
    let isPaused = false;
    let isTyping = false;
    let timeoutId = null;
    let isUiHidden = false;

    // Start-Funktion
    function startTyping(text, autoLoop = false) {
      clearTimeout(timeoutId);
      currentText = text.toUpperCase();
      currentIndex = 0;
      typedContentEl.textContent = '';
      isTyping = true;
      isPaused = false;
      isAutoLooping = autoLoop;
      updatePauseUI();
      statusBadgeEl.textContent = "SCHREIBT...";
      typeNextChar();
    }

    // Nächstes Zeichen tippen
    function typeNextChar() {
      if (isPaused) return;

      if (currentIndex < currentText.length) {
        const targetChar = currentText[currentIndex];

        // Wenn das Zeichen ein korrekter typografischer Apostroph ist ('’')
        if (targetChar === '’') {
          // 1. Zufälligen falschen Apostroph tippen
          const wrongChar = wrongApostrophes[Math.floor(Math.random() * wrongApostrophes.length)];
          typedContentEl.textContent += wrongChar;
          
          // Deutlich längere Denkpause/Zögern, damit der Fehler richtig auffällt (ca. 1.2s - 1.8s)
          const pauseBeforeErase = 1200 + Math.random() * 600;
          
          timeoutId = setTimeout(() => {
            if (isPaused) return;
            // Falsches Zeichen löschen
            typedContentEl.textContent = typedContentEl.textContent.slice(0, -1);
            
            // Nach kurzer Nachdenkpause echten Apostroph einfügen
            const pauseBeforeCorrection = 350 + Math.random() * 250;
            timeoutId = setTimeout(() => {
              if (isPaused) return;
              typedContentEl.textContent += '’';
              currentIndex++;
              scheduleNextChar();
            }, pauseBeforeCorrection);

          }, pauseBeforeErase);

        } else {
          // Normales Zeichen tippen
          typedContentEl.textContent += targetChar;
          currentIndex++;
          scheduleNextChar();
        }
      } else {
        // Satz ist fertig!
        isTyping = false;
        statusBadgeEl.textContent = "FERTIG";

        if (isAutoLooping) {
          // Nach Verweildauer wieder löschen und zum nächsten Satz springen
          timeoutId = setTimeout(() => {
            eraseCurrentText(() => {
              autoLoopIndex = (autoLoopIndex + 1) % sentenceList.length;
              presetSelectEl.value = autoLoopIndex;
              startTyping(sentenceList[autoLoopIndex], true);
            });
          }, 3000);
        }
      }
    }

    // Satz langsam rückwärts/schrittweise löschen
    function eraseCurrentText(onComplete) {
      if (typedContentEl.textContent.length > 0) {
        typedContentEl.textContent = typedContentEl.textContent.slice(0, -1);
        timeoutId = setTimeout(() => eraseCurrentText(onComplete), baseSpeed * 0.4);
      } else if (onComplete) {
        onComplete();
      }
    }

    function scheduleNextChar() {
      timeoutId = setTimeout(typeNextChar, getJitteredSpeed());
    }

    // Natürliches Tipp-Feeling mit Zufallsabweichung
    function getJitteredSpeed() {
      const jitter = (Math.random() - 0.5) * (baseSpeed * 0.6);
      return Math.max(20, baseSpeed + jitter);
    }

    // UI Ein-/Ausblenden Toggle
    function toggleUiVisibility() {
      isUiHidden = !isUiHidden;
      if (isUiHidden) {
        controlPanelEl.classList.add('opacity-0', 'pointer-events-none', 'translate-y-8');
        headerEl.classList.add('opacity-0');
        btnShowUi.classList.remove('opacity-0', 'pointer-events-none');
      } else {
        controlPanelEl.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-8');
        headerEl.classList.remove('opacity-0');
        btnShowUi.classList.add('opacity-0', 'pointer-events-none');
      }
    }

    // Event Listener für UI Buttons
    btnHideUi.addEventListener('click', toggleUiVisibility);
    btnShowUi.addEventListener('click', toggleUiVisibility);

    // Tastatur-Shortcut 'H' zum Ein-/Ausblenden
    document.addEventListener('keydown', (e) => {
      if (e.key.toLowerCase() === 'h' && document.activeElement !== customInputEl) {
        toggleUiVisibility();
      }
    });

    // Pause / Play Toggle
    btnTogglePause.addEventListener('click', () => {
      isPaused = !isPaused;
      updatePauseUI();
      if (!isPaused) {
        statusBadgeEl.textContent = "SCHREIBT...";
        typeNextChar();
      } else {
        statusBadgeEl.textContent = "PAUSIERT";
        clearTimeout(timeoutId);
      }
    });

    function updatePauseUI() {
      if (isPaused) {
        iconPause.classList.add('hidden');
        iconPlay.classList.remove('hidden');
      } else {
        iconPause.classList.remove('hidden');
        iconPlay.classList.add('hidden');
      }
    }

    // Replay Button
    btnReplay.addEventListener('click', () => {
      startTyping(currentText, isAutoLooping);
    });

    // Custom Text abspielen & im LocalStorage speichern
    btnPlayCustom.addEventListener('click', () => {
      const text = customInputEl.value.trim();
      if (text) {
        // Falls der Satz neu ist, speichern wir ihn
        if (!sentenceList.includes(text)) {
          customSavedSentences.push(text);
          localStorage.setItem('axel_custom_sentences', JSON.stringify(customSavedSentences));
          sentenceList.push(text);
          renderSelectOptions();
        }
        
        const newIndex = sentenceList.indexOf(text);
        autoLoopIndex = newIndex;
        presetSelectEl.value = newIndex;
        customInputEl.value = '';
        startTyping(text, true);
      }
    });

    customInputEl.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        btnPlayCustom.click();
      }
    });

    // Preset Auswahl
    presetSelectEl.addEventListener('change', (e) => {
      const index = parseInt(e.target.value);
      autoLoopIndex = index;
      startTyping(sentenceList[index], true);
    });

    // Speed Slider
    speedSlider.addEventListener('input', (e) => {
      const val = parseInt(e.target.value);
      baseSpeed = 280 - val;
      if (val < 90) speedLabel.textContent = "Langsam";
      else if (val < 180) speedLabel.textContent = "Normal";
      else speedLabel.textContent = "Schnell";
    });

    // Beim Laden direkt starten
    window.onload = function() {
      renderSelectOptions();
      startTyping(sentenceList[0], true);
    };
  </script>
</body>
</html>
